version: 2

project_name: diceware

builds:
  - id: diceware
    binary: diceware
    main: ./cmd/diceware
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
      - freebsd
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: default
    ids:
      - diceware
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- if eq .Os "darwin" }}macos
      {{- else }}{{ .Os }}{{ end }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
    files:
      - README.md
      - LICENSE
      - wordlists/wordlist-basque-diceware.txt

checksum:
  name_template: checksums.txt
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs(\\(.+\\))?:"
      - "^test(\\(.+\\))?:"
      - "^ci(\\(.+\\))?:"
      - "^chore(\\(.+\\))?:"
      - "README"
      - "Merge pull request"
      - "Merge branch"

dockers_v2:
  - id: diceware
    ids:
      - diceware
    dockerfile: Dockerfile
    images:
      - "ghcr.io/{{ .Env.GORELEASER_REPO_OWNER }}/{{ .ProjectName }}"
      - "{{ .Env.DOCKERHUB_USERNAME }}/{{ .ProjectName }}"
    tags:
      - "{{ .Version }}"
      - "latest"
    platforms:
      - linux/amd64
      - linux/arm64
    build_args:
      VERSION: "{{ .Version }}"
    extra_files:
      - go.mod
      - go.sum
      - diceware.go
      - cmd
      - wordlists
    annotations:
      "index,manifest:org.opencontainers.image.title": "{{ .ProjectName }}"
      "index,manifest:org.opencontainers.image.description": "Diceware passphrase generator with a live terminal view"
      "index,manifest:org.opencontainers.image.url": "https://github.com/{{ .Env.GORELEASER_REPO_OWNER }}/{{ .ProjectName }}"
      "index,manifest:org.opencontainers.image.source": "https://github.com/{{ .Env.GORELEASER_REPO_OWNER }}/{{ .ProjectName }}"
      "index,manifest:org.opencontainers.image.version": "{{ .Version }}"
      "index,manifest:org.opencontainers.image.created": "{{ .Date }}"
      "index,manifest:org.opencontainers.image.revision": "{{ .FullCommit }}"
      "index,manifest:org.opencontainers.image.licenses": "MIT"
    labels:
      org.opencontainers.image.title: "{{ .ProjectName }}"
      org.opencontainers.image.description: "Diceware passphrase generator with a live terminal view"
      org.opencontainers.image.url: "https://github.com/{{ .Env.GORELEASER_REPO_OWNER }}/{{ .ProjectName }}"
      org.opencontainers.image.source: "https://github.com/{{ .Env.GORELEASER_REPO_OWNER }}/{{ .ProjectName }}"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.created: "{{ .Date }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.licenses: "MIT"

homebrew_casks:
  - name: diceware
    repository:
      owner: "{{ .Env.GITHUB_REPOSITORY_OWNER }}"
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Casks
    commit_author:
      name: "{{ .Env.HOMEBREW_TAP_PUBLISHER_NAME }}"
      email: "{{ .Env.HOMEBREW_TAP_PUBLISHER_EMAIL }}"
    commit_msg_template: "chore(brew): update cask for {{ .ProjectName }} {{ .Tag }}"
    homepage: "https://github.com/hastefuI/diceware"
    description: "Diceware passphrase generator with a live terminal view"
    binaries:
      - diceware

release:
  draft: false
  prerelease: auto
  mode: append
